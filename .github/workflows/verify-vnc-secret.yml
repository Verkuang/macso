name: Verify VNC password format
on:
  workflow_dispatch:
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate without revealing password
        env:
          MACOS_VNC_PASSWORD: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          p = os.environ.pop('MACOS_VNC_PASSWORD', '')
          issues = []
          if not p: issues.append('VNC password is missing.')
          elif len(p) < 6: issues.append('VNC password is shorter than 6 characters.')
          elif len(p) > 8: issues.append('VNC password is longer than 8 characters.')
          if any(c.isspace() for c in p): issues.append('VNC password contains whitespace or a line break.')
          if any(ord(c) < 33 or ord(c) > 126 for c in p) and not any(c.isspace() for c in p): issues.append('VNC password contains a non-ASCII or control character.')
          for issue in issues: print('::error::' + issue)
          if issues: raise SystemExit(1)
          print('VNC password format is valid. No password value is logged.')
          PY
