name: Finish replaced test desktop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-old-desktop.yml']
permissions: {contents: read, actions: write}
jobs:
  finish:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const run_id = 37839158546;
            const r = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            if (r.data.status === 'completed') return;
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...context.repo, run_id});
            core.notice('Replaced empty test desktop cancellation accepted.');
